<!doctype html>
<html lang="pt-BR">
  <head>

    <link rel="stylesheet" href="css/style.css" />

  <body>

    <header class="topo">
      <div class="topo__inner">
        <a class="marca" href="#/" id="marca" aria-label="Ir para o início">

            id="marca-avatar"
            aria-hidden="true"
          ></span>

          id="menu-toggle"
          aria-expanded="false"
          aria-controls="menu"

          <a href="#/experiencia" data-rota="experiencia">Experiência</a>

      </div>
    </header>

    <main id="conteudo" tabindex="-1"></main>

    <footer class="rodape">
      <p id="rodape-texto"></p>
    </footer>

    <noscript
      ><p style="padding: 2rem; color: #fff">
        Este portfólio precisa de JavaScript para funcionar.
      </p></noscript

    <script src="js/data.js"></script>
    <script src="js/config.js"></script>

    <script src="js/app.js"></script>
